<text x="306" y="123" class="sub" text-anchor="middle">37 cloud-specific tools</text>
<text x="527" y="123" class="sub" text-anchor="middle">Cross-cloud tools (6)</text>

<text x="39" y="147" class="uri" text-anchor="start">cost://summary/schema</text>
<text x="39" y="166" class="uri" text-anchor="start">cost://finops/framework</text>
<text x="39" y="185" class="uri" text-anchor="start">cost://playbook/quick-wins</text>

<text x="306" y="171" class="sub" text-anchor="middle">AWS · Azure · GCP</text>
<text x="306" y="189" class="tiny" text-anchor="middle">37 provider-specific FinOps operations</text>

<text x="415" y="144" class="tiny" text-anchor="start">validate_cloud_connectivity</text>
<text x="415" y="159" class="tiny" text-anchor="start">Cost Dashboard</text>
