<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" aria-label="multicloud-costopti-mcp architecture diagram">
<title>multicloud-costopti-mcp architecture</title>
<desc>Claude Desktop MCP client connects over stdio to the multicloud-costopti-mcp server, with resources, provider-specific FinOps tools, cross-cloud tools, shared analysis modules, and AWS, Azure, and GCP cost optimization integrations.</desc>
<style>
  text { font-family: Inter, Arial, Helvetica, sans-serif; fill:#1e2432; }
  .hd { font-size:12px; font-weight:700; }
  .sub { font-size:9px; font-weight:700; }
  .txt { font-size:8.9px; }
  .tiny { font-size:8px; }
  .uri { font-size:8.2px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  .arrow { fill:none; stroke:#56566e; stroke-width:1.5; stroke-linejoin:round; }
</style>
<defs>
  <marker id="arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <path d="M0 0 L7 3.5 L0 7Z" fill="#56566e"/>
  </marker>
</defs>

<rect width="680" height="700" fill="#fcfdff"/>

<!-- Top client -->
<rect x="203" y="10" width="274" height="43" rx="9" fill="#eee9ff" stroke="#6550a7" stroke-width="1.6"/>
<text x="340" y="28" class="hd" text-anchor="middle">Claude Desktop / AI Agent</text>
<text x="340" y="43" class="txt" text-anchor="middle">MCP Client</text>
<path d="M340 53 V77" class="arrow" marker-end="url(#arrowhead)"/>
<text x="352" y="69" class="sub" text-anchor="start">stdio</text>

<!-- MCP server -->
