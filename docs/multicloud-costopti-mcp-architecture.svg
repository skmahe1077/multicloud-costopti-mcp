<text x="340" y="96" class="hd" text-anchor="middle">MCP Server · multicloud-costopti-mcp</text>

<rect x="30" y="106" width="178" height="143" rx="7" fill="#ffffff" stroke="#7161b5" stroke-width="1.2"/>
<rect x="216" y="106" width="180" height="143" rx="7" fill="#ffffff" stroke="#7161b5" stroke-width="1.2"/>
<rect x="404" y="106" width="246" height="143" rx="7" fill="#ffffff" stroke="#7161b5" stroke-width="1.2"/>

