<text x="39" y="318" class="sub" text-anchor="start">Centralized shared modules</text>

<rect x="39" y="327" width="101" height="26" rx="5" fill="#eee9ff" stroke="#8272bc" stroke-width="1"/>
<text x="89.5" y="344" class="tiny" text-anchor="middle">cost normalizer</text>

