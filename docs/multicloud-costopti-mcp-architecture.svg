<text x="206" y="341" class="tiny" text-anchor="middle">savings calculator</text>
<text x="206" y="349" class="tiny" text-anchor="middle">(priority scoring)</text>

<rect x="272" y="327" width="132" height="26" rx="5" fill="#eee9ff" stroke="#8272bc" stroke-width="1"/>
<text x="338" y="341" class="tiny" text-anchor="middle">cost trend analyzer</text>
<text x="338" y="349" class="tiny" text-anchor="middle">(anomaly detection)</text>

<rect x="411" y="327" width="123" height="26" rx="5" fill="#eee9ff" stroke="#8272bc" stroke-width="1"/>
<text x="472.5" y="341" class="tiny" text-anchor="middle">tag analyzer</text>
<text x="472.5" y="349" class="tiny" text-anchor="middle">(FinOps tag coverage)</text>

<rect x="541" y="327" width="75" height="26" rx="5" fill="#eee9ff" stroke="#8272bc" stroke-width="1"/>
<text x="578.5" y="344" class="tiny" text-anchor="middle">logger</text>

<rect x="39" y="366" width="602" height="42" rx="7" fill="#fcfcff" stroke="#9c9bb0" stroke-width="1"/>
<text x="340" y="383" class="tiny" text-anchor="middle">retry / exponential backoff — centralized in server.ts</text>
<text x="340" y="396" class="tiny" text-anchor="middle">used by the cross-cloud tools only</text>

